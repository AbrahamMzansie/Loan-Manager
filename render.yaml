services:
  - type: web
    name: loan-manager-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://loan-manager-client-vqvb.onrender.com
      - key: ALLOW_FIRST_ADMIN_SETUP
        value: false

  - type: web
    name: loan-manager-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://loan-manager-api-wtwm.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
